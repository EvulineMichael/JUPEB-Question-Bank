<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Check</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
    }
    .box {
        padding: 40px 60px;
        background: #1e293b;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .code {
        font-size: 3rem;
        font-weight: 800;
        color: #3b82f6;
        margin-bottom: 12px;
        letter-spacing: 4px;
    }
    .teacher {
        font-size: 1.6rem;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 8px;
    }
    .none {
        font-size: 1.2rem;
        color: #94a3b8;
    }
</style>
</head>
<body>
    <div class="box">
        <div class="code" id="code">—</div>
        <div class="teacher" id="teacher">No referral code</div>
        <div class="none" id="hint">Add ?ref=XXX to the URL</div>
    </div>

    <script>
        const REFERRAL_CODES = {
            "ABD001": "Abdul",
            "COL001": "Collins",
            "OBI001": "Obinna",
            "SEG001": "Segun",
            "CHI001": "Chidinma",
            "TEN001": "Tenkat",
            "EDA001": "Edafe"
        };

        const params = new URLSearchParams(window.location.search);
        const ref = params.get("ref");

        if (ref) {
            document.getElementById("code").textContent = ref;
            if (REFERRAL_CODES[ref]) {
                document.getElementById("teacher").textContent = REFERRAL_CODES[ref];
                document.getElementById("hint").textContent = "✓ Valid code";
                document.getElementById("hint").style.color = "#22c55e";
            } else {
                document.getElementById("teacher").textContent = "Unknown code";
                document.getElementById("hint").textContent = "✗ Not a registered teacher code";
                document.getElementById("hint").style.color = "#ef4444";
            }
        }
    </script>
</body>
</html>
